name: PR Agent Dispatch

on:
  repository_dispatch:
    types: [pr-agent-requested]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  dispatch-external-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Forward the PR agent request to the configured webhook
        uses: actions/github-script@91a83c091797b22c5771b1d7178fd0fddacc73ea
        env:
          CODEX_AGENT_WEBHOOK_URL: ${{ secrets.CODEX_AGENT_WEBHOOK_URL }}
          CODEX_AGENT_WEBHOOK_TOKEN: ${{ secrets.CODEX_AGENT_WEBHOOK_TOKEN }}
          CLAUDE_AGENT_WEBHOOK_URL: ${{ secrets.CLAUDE_AGENT_WEBHOOK_URL }}
          CLAUDE_AGENT_WEBHOOK_TOKEN: ${{ secrets.CLAUDE_AGENT_WEBHOOK_TOKEN }}
          SENTRY_AGENT_WEBHOOK_URL: ${{ secrets.SENTRY_AGENT_WEBHOOK_URL }}
          SENTRY_AGENT_WEBHOOK_TOKEN: ${{ secrets.SENTRY_AGENT_WEBHOOK_TOKEN }}
          GIT_AGENT_WEBHOOK_URL: ${{ secrets.GIT_AGENT_WEBHOOK_URL }}
          GIT_AGENT_WEBHOOK_TOKEN: ${{ secrets.GIT_AGENT_WEBHOOK_TOKEN }}
        with:
          script: |
            const payload = context.payload.client_payload || {};
            const agent = `${payload.agent || ''}`.trim().toLowerCase();
            const issueNumber = Number(payload.issue_number);
            const pullRequestNumber = Number(payload.pr_number);
            const commentId = Number(payload.comment_id);

            const routes = {
              codex: {
                label: 'Codex',
                secretNames: ['CODEX_AGENT_WEBHOOK_URL', 'CODEX_AGENT_WEBHOOK_TOKEN'],
                url: process.env.CODEX_AGENT_WEBHOOK_URL,
                token: process.env.CODEX_AGENT_WEBHOOK_TOKEN,
              },
              claude: {
                label: 'Claude',
                secretNames: ['CLAUDE_AGENT_WEBHOOK_URL', 'CLAUDE_AGENT_WEBHOOK_TOKEN'],
                url: process.env.CLAUDE_AGENT_WEBHOOK_URL,
                token: process.env.CLAUDE_AGENT_WEBHOOK_TOKEN,
              },
              sentry: {
                label: 'Sentry review',
                secretNames: ['SENTRY_AGENT_WEBHOOK_URL', 'SENTRY_AGENT_WEBHOOK_TOKEN'],
                url: process.env.SENTRY_AGENT_WEBHOOK_URL,
                token: process.env.SENTRY_AGENT_WEBHOOK_TOKEN,
              },
              git: {
                label: 'git-agent',
                secretNames: ['GIT_AGENT_WEBHOOK_URL', 'GIT_AGENT_WEBHOOK_TOKEN'],
                url: process.env.GIT_AGENT_WEBHOOK_URL,
                token: process.env.GIT_AGENT_WEBHOOK_TOKEN,
              },
            };

            const route = routes[agent];
            if (!route) {
              core.setFailed(`Unsupported PR agent route: ${agent || 'unknown'}`);
              return;
            }

            const createIssueComment = async (body) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            };

            if (!route.url) {
              await createIssueComment([
                `### ${route.label} dispatch not configured`,
                '',
                `The PR agent router received a request for ${route.label}, but this repository is missing the required webhook secret: \`${route.secretNames[0]}\`.`,
                '',
                `Set \`${route.secretNames[0]}\` and optionally \`${route.secretNames[1]}\` in GitHub Actions secrets, then retry from the PR comment thread.`,
              ].join('\n'));
              core.setFailed(`Missing webhook URL for ${agent}.`);
              return;
            }

            const prompt = `${payload.prompt || ''}`.trim();
            if (prompt.length > 8000) {
              core.setFailed('Agent prompt exceeds the 8,000-character routing limit.');
              return;
            }
            if (agent === 'git' && !prompt) {
              await createIssueComment([
                '### git-agent request needs a prompt',
                '',
                'Use `/git-agent <what you want done>` or `/agent git <what you want done>` so the external worker receives a concrete instruction set.',
              ].join('\n'));
              core.setFailed('git-agent request was missing a prompt.');
              return;
            }

            if (!Number.isSafeInteger(commentId) || commentId <= 0) {
              core.setFailed('Dispatch payload is missing a valid trigger comment id.');
              return;
            }

            const [{ data: pull }, { data: triggerComment }] = await Promise.all([
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequestNumber,
              }),
              github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
              }),
            ]);

            const idempotencySource = `${context.repo.owner}/${context.repo.repo}:${commentId}:${agent}`;
            const idempotencyKey = require('node:crypto')
              .createHash('sha256')
              .update(idempotencySource)
              .digest('hex');

            const requestBody = {
              agent,
              idempotency_key: idempotencyKey,
              requested_at: payload.requested_at || new Date().toISOString(),
              requested_by: payload.sender_login || context.actor,
              sources: payload.sources || [],
              prompt,
              repository: {
                owner: context.repo.owner,
                repo: context.repo.repo,
              },
              pull_request: {
                number: pull.number,
                title: pull.title,
                html_url: pull.html_url,
                diff_url: pull.diff_url,
                patch_url: pull.patch_url,
                head: {
                  ref: pull.head.ref,
                  sha: pull.head.sha,
                  repo: pull.head.repo?.full_name || null,
                },
                base: {
                  ref: pull.base.ref,
                  sha: pull.base.sha,
                  repo: pull.base.repo?.full_name || null,
                },
              },
              trigger_comment: {
                id: commentId,
                url: payload.comment_url || null,
                body: `${triggerComment.body || ''}`.slice(0, 8000),
              },
            };

            const headers = {
              'content-type': 'application/json',
              'user-agent': 'bidspace-pr-agent-dispatch',
            };

            if (route.token) {
              headers.authorization = `Bearer ${route.token}`;
            }
            headers['idempotency-key'] = idempotencyKey;

            const readResponsePrefix = async (httpResponse, maxBytes) => {
              if (!httpResponse.body) return '';

              const reader = httpResponse.body.getReader();
              const decoder = new TextDecoder();
              const chunks = [];
              let bytesRead = 0;

              try {
                while (bytesRead < maxBytes) {
                  const { done, value } = await reader.read();
                  if (done) break;

                  const remaining = maxBytes - bytesRead;
                  const boundedValue = value.byteLength > remaining
                    ? value.subarray(0, remaining)
                    : value;
                  chunks.push(decoder.decode(boundedValue, { stream: true }));
                  bytesRead += boundedValue.byteLength;

                  if (value.byteLength > remaining || bytesRead >= maxBytes) {
                    await reader.cancel();
                    break;
                  }
                }
                chunks.push(decoder.decode());
                return chunks.join('');
              } finally {
                reader.releaseLock();
              }
            };

            let response;
            let rawResponse;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30_000);
            try {
              response = await fetch(route.url, {
                method: 'POST',
                headers,
                body: JSON.stringify(requestBody),
                signal: controller.signal,
              });
              if (response.ok) {
                rawResponse = await readResponsePrefix(response, 4096);
              } else if (response.body) {
                await response.body.cancel();
                rawResponse = '';
              }
            } catch (error) {
              await createIssueComment([
                `### ${route.label} dispatch failed`,
                '',
                'The webhook request timed out or could not be completed.',
                '',
                `Source: ${payload.comment_url || pull.html_url}`,
              ].join('\n'));
              core.setFailed('Webhook request timed out or could not be completed.');
              return;
            } finally {
              clearTimeout(timeout);
            }

            if (!response.ok) {
              await createIssueComment([
                `### ${route.label} dispatch failed`,
                '',
                `Webhook returned HTTP ${response.status}.`,
                '',
                `Source: ${payload.comment_url || pull.html_url}`,
              ].join('\n'));
              core.setFailed(`Webhook returned HTTP ${response.status}.`);
              return;
            }

            let requestId = '';
            try {
              const parsed = rawResponse ? JSON.parse(rawResponse) : null;
              const candidateRequestId = `${parsed?.request_id || parsed?.requestId || parsed?.id || ''}`;
              requestId = /^[A-Za-z0-9._:-]{1,128}$/.test(candidateRequestId)
                ? candidateRequestId
                : '';
            } catch {
              requestId = '';
            }

            await createIssueComment([
              `### ${route.label} dispatched`,
              '',
              `The PR agent router forwarded this request to the configured ${route.label} webhook.`,
              `Source: ${payload.comment_url || pull.html_url}`,
              requestId ? `Request id: ${requestId}` : `Webhook status: HTTP ${response.status}`,
            ].filter((line) => line !== null).join('\n'));
